
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspen Fashion | Doublewide Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@200;400;600&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fcfcfc;
            color: #1a1a1a;
            margin: 0;
            overflow: hidden;
        }

        .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }

        .doublewide-panel {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .aspen-gold {
            color: #c5a059;
        }

        .aspen-bg-gold {
            background-color: #c5a059;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(197, 160, 89, 0.5);
            position: absolute;
            top: 0;
            left: 0;
            animation: scan 3s linear infinite;
            z-index: 10;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .is-scanning .scan-line {
            display: block;
        }

        /* Custom scrollbar for high fashion */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c5a059; }
    </style>
